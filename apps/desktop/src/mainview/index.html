<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Factory</title>
    <script>
      // Before the app's script runs: a double-click on the title bar (the toolbar strip below) is
      // remembered, and main.tsx zooms (or whatever the system setting says) once it can. Dragging
      // needs nothing here: Electrobun's preload moves the window from the drag-region class.
      (() => {
        function onDoubleClick(e) {
          var t = e.target;
          if (t?.closest?.(".electrobun-webkit-app-region-drag")) {
            window.__sfEarlyDoubleClick = Date.now();
          }
        }
        document.addEventListener("dblclick", onDoubleClick);
        window.__sfStopEarlyDoubleClick = () => {
          document.removeEventListener("dblclick", onDoubleClick);
        };
      })();
    </script>
  </head>
  <body>
    <!-- The window while the app loads (lib/window-shell.ts, WindowSkeleton): React replaces it. -->
    <div id="root">
      <div class="flex h-dvh select-none flex-col bg-window text-ink" aria-busy="true" data-testid="static-shell">
        <div class="electrobun-webkit-app-region-drag flex h-11 flex-none items-center gap-1 pr-2.5 pl-[84px]"></div>
        <div class="flex min-h-0 flex-1 pr-2">
          <div class="flex w-[52px] flex-none flex-col items-center gap-2 pt-1 pb-2.5">
            <div class="size-8 animate-pulse rounded-full bg-line-strong"></div>
            <div class="size-8 animate-pulse rounded-full bg-line-strong"></div>
          </div>
          <div class="flex w-[196px] flex-none flex-col gap-2 pt-1.5 pr-2 pb-2.5 pl-3">
            <div class="h-5 w-24 animate-pulse rounded-md bg-line-strong"></div>
            <div class="h-4 w-32 animate-pulse rounded-md bg-line-strong"></div>
            <div class="h-4 w-28 animate-pulse rounded-md bg-line-strong"></div>
            <div class="h-4 w-30 animate-pulse rounded-md bg-line-strong"></div>
          </div>
          <div class="flex min-w-0 flex-1 flex-col gap-3 overflow-hidden rounded-xl bg-panel p-6 shadow-panel">
            <div class="h-8 w-48 animate-pulse rounded-md bg-accent"></div>
            <div class="h-36 w-full animate-pulse rounded-md bg-accent"></div>
            <div class="h-36 w-full animate-pulse rounded-md bg-accent"></div>
          </div>
        </div>
        <div class="h-7 flex-none"></div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
