<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inbox: all clear, offline (phone)</title><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#f1f1ef;color:#1c1c1e;font:15px/1.4 'Geist',system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;color:#6e6e73}
.muted{color:#6e6e73;font-size:13px}
.bar{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.bar h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;flex:1}
.chips{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px #e3e3e0;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:#1c1c1e;color:#fafafa;box-shadow:none}
.list{flex:1;padding:2px 12px 12px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.sec{padding:10px 4px 2px;font-size:12px;font-weight:500;color:#6e6e73}
.card{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px #e3e3e0,0 1px 2px rgba(0,0,0,.04);text-decoration:none;color:inherit}
.card.need{box-shadow:0 0 0 1.5px #f0b541,0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;align-items:center;gap:8px}
.t{font-weight:600;line-height:1.3}
.badge{font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.a{background:#fdecc8;color:#7a4a00}.b{background:#e3edfd;color:#1d4ed8}.g{background:#e4f4e8;color:#17603a}.z{background:#ececea;color:#3a3a3e}
.dot{width:8px;height:8px;border-radius:999px;display:inline-block;flex:none}
.btn{flex:1;height:44px;border-radius:11px;border:0;font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.p{background:#1c1c1e;color:#fafafa}.o{background:#fff;box-shadow:0 0 0 1px #e3e3e0;color:#1c1c1e}
.tabs{flex:none;display:flex;align-items:center;justify-content:space-around;height:64px;padding:0 8px 6px;background:#fff;box-shadow:0 -1px 0 #e3e3e0}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:#6e6e73;min-width:64px;position:relative}
.tab.on{color:#1c1c1e}
.tab i{font-style:normal;width:22px;height:22px;display:block}
.cnt{position:absolute;top:-4px;right:12px;min-width:17px;height:17px;border-radius:999px;background:#f59e0b;color:#fff;font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
.fab{width:56px;height:56px;border-radius:18px;background:#1c1c1e;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.22)}
.seg{display:flex;margin:0 16px 10px;padding:3px;border-radius:11px;background:#e7e7e4}
.seg span{flex:1;text-align:center;padding:7px 0;border-radius:8px;font-size:13px;font-weight:500;color:#55555a}
.seg .on{background:#fff;color:#1c1c1e;box-shadow:0 0 0 1px #e3e3e0}
svg{display:block}


.top{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.top .tt{flex:1;min-width:0}.top .tt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptabs{display:flex;gap:4px;margin:4px 14px 8px;padding:3px;border-radius:11px;background:#e7e7e4}
.ptabs span{flex:1;text-align:center;padding:7px 0;border-radius:8px;font-size:13px;font-weight:500;color:#55555a}
.ptabs .on{background:#fff;color:#1c1c1e;box-shadow:0 0 0 1px #e3e3e0}
.opt{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:11px;box-shadow:0 0 0 1px #e3e3e0;background:#fff}
.opt.on{box-shadow:0 0 0 1.5px #2563eb;background:#f3f7ff}
.radio{width:16px;height:16px;border-radius:999px;box-shadow:inset 0 0 0 1.5px #c4c4c0;flex:none}.on .radio{box-shadow:inset 0 0 0 5px #2563eb}
.why{padding:2px 0 2px 10px;border-left:2px solid #f0b541;color:#55555a;font-size:13.5px;line-height:1.45}
.done{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:#e9e9e6}
.tick{width:18px;height:18px;border-radius:999px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;font-size:11px}
.gate{flex:none;display:flex;gap:8px;padding:10px 12px 14px;background:#fff;box-shadow:0 -1px 0 #e3e3e0}
.doc{flex:1;overflow:auto;background:#fff;padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px}
.doc h2{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}.h{margin-top:10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6e6e73}
.li{display:flex;gap:8px;padding:3px 8px;margin:0 -8px;border-radius:7px;line-height:1.45}.li i{font-style:normal;color:#a3a3a0}
.src{font-family:'Geist Mono',monospace;font-size:10.5px;padding:0 5px;border-radius:4px;background:#ececea;color:#55555a;margin-left:4px;white-space:nowrap}
.kb{flex:none;background:#d7d9de;padding:8px 6px 14px;display:flex;flex-direction:column;gap:6px}.kb div{display:flex;gap:5px;justify-content:center}.kb span{flex:1;max-width:34px;height:38px;border-radius:6px;background:#fff;box-shadow:0 1px 0 #9a9ca1}

.sheet{background:#fff;border-radius:22px 22px 0 0;padding:10px 16px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.grab{width:40px;height:4px;border-radius:999px;background:#d6d6d2;align-self:center}
.dim{flex:1;background:rgba(28,28,30,.35)}
.kv{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-top:1px solid #f1f1ef}
.kv:first-child{border-top:0}
.kv b{font-weight:500;flex:1}
.group{border-radius:14px;background:#fff;box-shadow:0 0 0 1px #e3e3e0;overflow:hidden}
.sw{width:42px;height:25px;border-radius:999px;background:#d6d6d2;display:inline-flex;align-items:center;padding:0 3px;flex:none}
.sw i{width:19px;height:19px;border-radius:999px;background:#fff;display:block}
.sw.on{background:#2563eb;justify-content:flex-end}
.me{align-self:flex-end;max-width:84%;padding:9px 13px;border-radius:16px 16px 4px 16px;background:#1c1c1e;color:#fafafa;line-height:1.4}
.them{align-self:flex-start;max-width:88%;padding:9px 13px;border-radius:4px 16px 16px 16px;background:#fff;box-shadow:0 0 0 1px #e3e3e0;line-height:1.4}
.who{font-size:11.5px;color:#6e6e73;margin:2px 4px -4px}
.comp{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px 14px;background:#fff;box-shadow:0 -1px 0 #e3e3e0}
.inp{flex:1;min-height:44px;border-radius:14px;box-shadow:0 0 0 1px #d6d6d2;display:flex;align-items:center;padding:0 14px;color:#8a8a86}
.ib{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.act{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:#f6f6f4;box-shadow:0 0 0 1px #e3e3e0;font-size:14px}
.diffl{font-family:'Geist Mono',monospace;font-size:11.5px;line-height:1.6;white-space:pre;padding:0 12px}
.add{background:#e9f7ee;color:#17603a}.del{background:#fdeeee;color:#9b1c1c}
.banner{display:flex;align-items:center;gap:8px;margin:0 12px 8px;padding:9px 12px;border-radius:11px;font-size:13px}
.lock{flex:1;display:flex;flex-direction:column;gap:10px;padding:70px 12px 20px;background:linear-gradient(160deg,#2a2d3a,#15161c);color:#fff}
.note{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px)}
.note small{font-size:12px;color:rgba(255,255,255,.7)}
.note .acts{display:flex;gap:8px;margin-top:6px}.note .acts span{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.18);font-size:13px;font-weight:500}
</style></head><body><div class="bar"><h1>Inbox</h1><span class="badge z"><span class="dot" style="background:#a3a3a0"></span>&nbsp;Offline</span></div>
<div class="banner" data-name="offline banner" style="background:#ececea;color:#3a3a3e"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.500 6.500a8 8 0 0 1 11 0M4.700 9a5 5 0 0 1 6.600 0M8 12h0M2.500 2.500l11 11"></path></svg>You're offline. Showing what was loaded 12 min ago. Ideas you capture will send later.</div>
<div class="chips"><span class="chip on">All orgs</span><span class="chip">Personal</span><span class="chip">Client co</span></div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 32px;text-align:center"><span style="width:56px;height:56px;border-radius:999px;background:#e4f4e8;color:#17603a;display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 8.300 2.600 2.600L12 5.200"></path></svg></span>
<b style="font-size:18px">Nothing waits on you</b><div class="muted">5 items are running. 1 idea is waiting to send.</div></div><nav class="tabs" data-name="bottom tabs"><span class="tab on"><i><svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9h3l1 1.5h3l1-1.5h3"></path><path d="M4 3.500h8l1.500 5.500v3.500h-11V9z"></path></svg></i>Inbox<span class="cnt">3</span></span><span class="tab"><i><svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.500" y="2.500" width="9" height="11" rx="2"></rect><path d="m6 8.200 1.500 1.500 2.700-3"></path></svg></i>Work</span><span class="fab" data-name="capture button" style="margin-top:-26px"><svg width="24" height="24" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v10M3 8h10"></path></svg></span><span class="tab"><i><svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3.500h10v7H7.500L4.500 13v-2.500H3z"></path></svg></i>Chat</span><span class="tab"><i><svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="6" r="2.500"></circle><path d="M3.500 13c.500-2.200 2.300-3.500 4.500-3.500s4 1.300 4.500 3.500"></path></svg></i>You</span></nav></body></html>
