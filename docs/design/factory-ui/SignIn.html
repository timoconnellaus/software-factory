<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1c1c1e;text-decoration:none}a:hover{color:#55555a}

</head><body>

<div style="min-height: 900px; display: flex; flex-wrap: wrap; background: #ffffff; color: #1c1c1e; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-size: 13px; line-height: 1.4">
<main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; background: #f1f1ef"><div style="width: 100%; max-width: 380px; background: #ffffff; border: 1px solid #e3e3e0; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 16px"><div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; background: #1c1c1e; display: inline-block"></span><span style="font-size: 16px; font-weight: 600">Factory</span></div><h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Sign in</h1><p style="margin: 0; font-size: 13px; color: #55555a; line-height: 1.5">Your orgs and projects come from your GitHub account.</p><button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border: 0; border-radius: 7px; font: inherit; font-weight: 500; white-space: nowrap; cursor: pointer; background: #1c1c1e; color: #fafafa">Continue with GitHub</button><button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border: 0; border-radius: 7px; font: inherit; font-weight: 500; white-space: nowrap; cursor: pointer; background: #ffffff; color: #1c1c1e; box-shadow: 0 0 0 1px #e3e3e0, 0 1px 2px rgba(0, 0, 0, 0.04)">Use a passkey</button><p style="margin: 0; font-size: 13px; color: #55555a; line-height: 1.5">Approving a spec or a merge always asks for your passkey or Touch ID, even when you are signed in.</p></div></main>
</div>
