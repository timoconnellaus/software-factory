name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The job name is the status check branch protection requires on main: keep it `ci`.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The OS sandbox the runner host runs a project's checks in (ADR 0501): srt needs bubblewrap
      # and socat on Linux, and Ubuntu 24.04 restricts the unprivileged user namespaces bwrap uses.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 || true
          # srt's seccomp layer makes a nested user namespace inside bwrap's; the distro profile
          # for bwrap strips its children's capabilities, so that fails (srt's README, Ubuntu 24.04).
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict || true
          fi

      # Turborepo's local cache (.turbo/cache), keyed by commit and restored from the newest
      # earlier entry, so unchanged packages replay their typecheck and test results.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm lint
      - run: pnpm typecheck
      # Capped like local runs (docs/parallel-work.md): workerd tests are CPU-heavy.
      - run: pnpm test --concurrency=2
      # The real check sandbox, outside Turborepo's cache (a cached result would hide a runner
      # without bubblewrap), and required: SF_REQUIRE_SANDBOX fails the tests where it can't run.
      - run: pnpm --filter @software-factory/runner-host exec vitest run test/checks.test.ts
        env:
          SF_REQUIRE_SANDBOX: "1"
      # The deploy scripts and the repo guards (model ids, runner imports) aren't a workspace
      # package; their tests run on Node directly.
      - run: node --test "scripts/*/*.test.ts"
      # Hostile planning mockups in real engines (spec 21, ADR 0472): Chromium, and WebKit for the
      # desktop app's WKWebView. Nothing they try may reach the trap server or leave the frame.
      - run: pnpm --filter @software-factory/desktop exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @software-factory/desktop test:browser
      # The deploy refuses it too; failing here catches a floor raised too early before merge.
      - name: Desktop floor vs the published builds (ADR 0393)
        run: node scripts/deploy/desktop-floor.ts
      # Every Worker must bundle; a dry run catches what typecheck can't (bad bindings, imports).
      - run: pnpm build

  # The key helper's Swift unit tests (spec 40 M4b): the presence-message parser, the tag
  # allowlist, the exit codes. GitHub's macOS VMs have no Secure Enclave, so nothing here makes a key.
  key-helper-macos:
    name: key helper (macOS)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: swift test --package-path apps/desktop/native/sf-keys-app
      # The release's profile check reads a profile and a signature with plutil and codesign on this
      # same macOS image: run it on a synthetic profile and an ad-hoc signed binary, so a tool change
      # here fails CI and not a release (it once did: on macOS 15, `plutil -extract … json` reading stdin
      # exits 1 with no output).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          # Only node runs here, no install: setup-node would look for pnpm to cache.
          package-manager-cache: false
      - name: Profile check self-test
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp /usr/bin/true "$work/signed"
          sed 's/TEAM_ID/ABCDE12345/g' apps/desktop/native/sf-keys-app/sf-keys.entitlements > "$work/ents.plist"
          codesign --force --sign - --entitlements "$work/ents.plist" "$work/signed"
          node apps/desktop/scripts/check-profile.ts --self-test apps/desktop/test/fixtures/sf-keys-profile.plist "$work/signed"

  # SF Runner.app's launcher (spec 45 §1, ADR 0643): its Swift unit tests, then a real ad-hoc
  # bundle (the pinned Node, the sealed scripts, the launcher built with no Team ID) against the
  # tamper, environment, argument, planted-module, inspector and launch-constraint tests, with the
  # check's cost per start in the job summary. The Developer ID half runs in the release.
  runner-launcher-macos:
    name: runner launcher (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      NODE_DIST_VERSION: "24.21.0"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: swift test --package-path apps/desktop/native/sf-runner-launcher
      - name: Build an ad-hoc SF Runner.app
        working-directory: apps/desktop
        run: |
          node scripts/vendor-node.mjs
          node scripts/bundle-runner.mjs --sealed
          node scripts/runner-app.mjs --out "$RUNNER_TEMP/runner-app"
      - name: Launcher against the bundle
        run: |
          sw_vers
          node --test --test-reporter=spec apps/desktop/native/sf-runner-launcher/test/launcher.test.mjs
        env:
          SF_RUNNER_APP: ${{ runner.temp }}/runner-app/SF Runner.app

  # The real check sandbox on macOS (ADR 0501, third review): sandbox-exec, the real home and its
  # toolchain under it (hostedtoolcache, setup-pnpm), required.
  check-sandbox-macos:
    name: check sandbox (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @software-factory/runner-host exec vitest run test/checks.test.ts
        env:
          SF_REQUIRE_SANDBOX: "1"

  # A Linux runner host with Ubuntu's AppArmor restriction on unprivileged user namespaces left ON
  # (ADR 0501, third review, 6): the sandbox can't start, so the start-up trial must say so and every
  # check must come back "not run", never a failure sent to a fix round.
  check-sandbox-apparmor:
    name: check sandbox (AppArmor restriction on)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat ripgrep
          # On, whatever the image's default: this job is about a host that left it on.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sysctl kernel.apparmor_restrict_unprivileged_userns
      - run: pnpm --filter @software-factory/runner-host exec vitest run test/checks.test.ts
        env:
          SF_EXPECT_SANDBOX_BLOCKED: "1"
