name: Deploy

# Deploys main to Cloudflare once CI has passed on it, or on demand. See docs/deploying.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One production deploy at a time, in order; never cancel one half way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Secrets can't appear in a job's `if:`, so this job looks and reports. Without the token the
  # deploy job is skipped with a notice instead of failing.
  check:
    name: Check deploy prerequisites
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice title=Deploy skipped::The CLOUDFLARE_API_TOKEN secret is not set. Add it with 'gh secret set CLOUDFLARE_API_TOKEN' (see docs/deploying.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$ACCOUNT_ID" ]; then
            echo "::notice title=Deploy skipped::The CLOUDFLARE_ACCOUNT_ID variable is not set. Add it with 'gh variable set CLOUDFLARE_ACCOUNT_ID' (see docs/deploying.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI passed on, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history: the deploy finds the last commit that changed runner code (RUNNER_SHA,
          # ADR 0520) with `git log`. A shallow clone falls back to the deployed commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Workers to deploy
        run: node scripts/deploy/deploy.ts list
      - name: Provision D1, R2 and queues
        run: node scripts/deploy/provision.ts
      - name: Apply D1 migrations
        run: node scripts/deploy/deploy.ts migrate
      - name: Build Workers
        # sf-app is TanStack Start on the Cloudflare Vite plugin: `vite build` writes the bundle
        # that its `wrangler deploy` then uploads (.wrangler/deploy/config.json points at it).
        run: pnpm build
      - name: Deploy Workers
        run: node scripts/deploy/deploy.ts workers
      - name: Sync sf-app secrets
        # Pushes the repo secrets the dashboard needs into the Worker. Values never appear in logs.
        working-directory: apps/app
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GH_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
        run: |
          node -e '
            const keys = ["BETTER_AUTH_SECRET","GH_APP_CLIENT_SECRET","GH_APP_PRIVATE_KEY","GH_APP_WEBHOOK_SECRET"];
            const out = {};
            for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync("/tmp/sf-app-secrets.json", JSON.stringify(out));
            console.log("secrets to sync:", Object.keys(out).join(", ") || "none");
          '
          pnpm exec wrangler secret bulk /tmp/sf-app-secrets.json
          rm -f /tmp/sf-app-secrets.json
      - name: Sync sf-engine secrets
        # The runner channel's master secret, the GitHub App key (job tokens, branches, PRs,
        # merges, check runs) and its webhook secret. Values never appear in logs; unset ones are skipped.
        working-directory: apps/engine
        env:
          RUNNER_CHANNEL_SECRET: ${{ secrets.RUNNER_CHANNEL_SECRET }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
        run: |
          node -e '
            const keys = ["RUNNER_CHANNEL_SECRET","GH_APP_PRIVATE_KEY","GH_APP_WEBHOOK_SECRET"];
            const out = {};
            for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync("/tmp/sf-engine-secrets.json", JSON.stringify(out));
            console.log("secrets to sync:", Object.keys(out).join(", ") || "none");
          '
          pnpm exec wrangler secret bulk /tmp/sf-engine-secrets.json
          rm -f /tmp/sf-engine-secrets.json
