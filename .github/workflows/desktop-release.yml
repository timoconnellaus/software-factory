name: Desktop release

# Signed, notarized builds of the desktop app (spec 40 M4, ADR 0390), uploaded to
# downloads.zerobsai.com/desktop, where the app's updater looks.
# - every push to main that touches the app or anything it bundles → canary (version 0.1.<run>)
# - stable is NOT enabled. It will be a manual run of this workflow on main (never a tag), and it is
#   refused until the owner has locked the `release` environment down and set the repo variable
#   DESKTOP_STABLE_ENABLED=true (docs/deploying.md, "Before stable releases").
#
# Why no tag trigger: a workflow triggered by a tag runs the workflow file *at the tagged commit*,
# so anyone who can push a tag (anyone with write, or a factory job token) could run their own
# version of this file with the Developer ID. A manual run on main runs main's file.
#
# The signing material is in the `release` environment. Only main may deploy to it (its only
# allowed ref is the branch main; see docs/deploying.md).

on:
  push:
    branches: [main]
    # The app's own code and its whole bundled workspace closure (the same closure spec 38 computes
    # for the runner, plus the view's packages): a change to any of them changes the shipped app.
    paths:
      - apps/desktop/**
      - packages/**
      - local/runner-host/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - .github/workflows/desktop-release.yml
  workflow_dispatch:
    inputs:
      channel:
        description: "canary, or stable (refused until DESKTOP_STABLE_ENABLED is true)"
        type: choice
        options: [canary, stable]
        default: canary
      version:
        description: "stable only: the version, e.g. 1.2.3 (higher than every stable before it)"
        type: string
        default: ""

# Canary pushes queue behind each other and the newest wins; a stable run has its own group and is
# never cancelled.
concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && 'stable' || 'canary' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: desktop release
    runs-on: macos-15
    environment: release
    timeout-minutes: 60
    env:
      # The runner's Node (ADR 0390). Its sha256 is pinned in apps/desktop/scripts/vendor-node.mjs.
      NODE_DIST_VERSION: "24.21.0"
      R2_BUCKET: sf-desktop-releases
    steps:
      # Actions are pinned to commits: they run before and beside the signing material.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # Only main, and only a commit that is on main. Belt and braces: the environment's allowed
      # refs are what really stop another ref (docs/deploying.md).
      - name: Refuse anything that isn't main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::desktop releases run only on main (got $GITHUB_REF)"; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on origin/main"; exit 1
          fi

      # Without the bucket's token there is nowhere to publish: building, signing and a real Apple
      # notarization would all be thrown away, and every push to main would go red. A push then
      # skips the release with one notice; a manual run, which someone asked for, fails.
      - name: Release secrets present?
        id: secrets
        env:
          HAS_R2_KEY: ${{ secrets.DESKTOP_R2_ACCESS_KEY_ID != '' && secrets.DESKTOP_R2_SECRET_ACCESS_KEY != '' }}
        run: |
          if [ "$HAS_R2_KEY" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::the release environment has no DESKTOP_R2_ACCESS_KEY_ID / DESKTOP_R2_SECRET_ACCESS_KEY (docs/deploying.md)"; exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            msg="Desktop release skipped: the release environment has no DESKTOP_R2_* secrets yet, so nothing was built, signed, notarized or uploaded (docs/deploying.md, 'Desktop releases')."
            echo "::notice title=Desktop release skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Channel and version
        if: steps.secrets.outputs.ready == 'true'
        id: channel
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          STABLE_ENABLED: ${{ vars.DESKTOP_STABLE_ENABLED }}
        run: |
          if [ "${INPUT_CHANNEL:-canary}" = "stable" ]; then
            if [ "$STABLE_ENABLED" != "true" ]; then
              echo "::error::stable releases are not enabled: see docs/deploying.md, 'Before stable releases'"; exit 1
            fi
            if ! printf %s "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::stable needs a version like 1.2.3 (got '$INPUT_VERSION')"; exit 1
            fi
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "channel=canary" >> "$GITHUB_OUTPUT"
            echo "version=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_DIST_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.secrets.outputs.ready == 'true'

      # Before building: a version that is already published is never built again, and a stable
      # version must be higher than the one published (no downgrades, no overwrites).
      - name: Refuse a published or lower version
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/desktop
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          node scripts/publish-release.ts check \
            --channel "${{ steps.channel.outputs.channel }}" \
            --version "${{ steps.channel.outputs.version }}"

      # The Developer ID goes into a throwaway keychain that is deleted at the end, whatever happens.
      # Passwords go to `security` on stdin or in files, never on its command line.
      - name: Signing keychain
        if: steps.secrets.outputs.ready == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          cleanup() {
            rm -P -f "$RUNNER_TEMP/devid.p12" "$RUNNER_TEMP/devid.pem" "$RUNNER_TEMP/devid-once.p12" 2>/dev/null || true
          }
          trap cleanup EXIT
          KC_PW=$(/usr/bin/openssl rand -hex 24)
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          printf %s "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          # The .p12's real password never reaches a command line (ps): openssl (the system
          # LibreSSL, whose PKCS#12 `security` can read) takes it from the environment and re-wraps
          # the identity under a random one-time password, which is all `security import -P` sees.
          # Every intermediate file is mode 600 and removed on exit, failure included.
          export ONE_PW=$(/usr/bin/openssl rand -hex 24)
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/devid.p12" -passin env:MACOS_CERT_PASSWORD -nodes \
            -out "$RUNNER_TEMP/devid.pem" 2>/dev/null
          /usr/bin/openssl pkcs12 -export -in "$RUNNER_TEMP/devid.pem" -passout env:ONE_PW \
            -out "$RUNNER_TEMP/devid-once.p12"
          security import "$RUNNER_TEMP/devid-once.p12" -k "$KEYCHAIN" -f pkcs12 -P "$ONE_PW" -T /usr/bin/codesign
          cleanup
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          printf %s "$ASC_KEY_P8" > "$RUNNER_TEMP/notary.p8"

      # The key helper's provisioning profile (spec 40 M4b, ADR 0394). Without it the release ships
      # without the helper, as before M4b, and says so; with it, every helper step below runs and
      # must pass.
      - name: Key helper profile
        if: steps.secrets.outputs.ready == 'true'
        env:
          MACOS_KEYS_PROFILE: ${{ secrets.MACOS_KEYS_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_KEYS_PROFILE" ]; then
            msg="No key helper: the release environment has no MACOS_KEYS_PROFILE, so this build ships without SF Keys.app (a software key, no gate decisions from the desktop; spec 40 M4b)."
            echo "::notice title=Key helper skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          profile="$RUNNER_TEMP/sf-keys.provisionprofile"
          printf %s "$MACOS_KEYS_PROFILE" | base64 --decode > "$profile"
          security cms -D -i "$profile" > /dev/null || { echo "::error::MACOS_KEYS_PROFILE is not a provisioning profile"; exit 1; }
          echo "SF_KEYS_PROFILE=$profile" >> "$GITHUB_ENV"
          # The hook rebuilds the update archive with zstd, as Electrobun compresses it.
          command -v zstd > /dev/null || brew install zstd

      # The helper's parser and allowlist (spec 40 M4b), before it is built into a release.
      - name: Key helper unit tests
        if: steps.secrets.outputs.ready == 'true' && env.SF_KEYS_PROFILE != ''
        run: swift test --package-path apps/desktop/native/sf-keys-app

      - name: Build, sign and notarize
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/desktop
        # Electrobun signs and notarizes itself (after it writes the build hash into the bundle).
        # With SF_KEYS_PROFILE, the postPackage hook then adds the key helper, re-signs the outer
        # seal and notarizes again (scripts/keys-helper.ts).
        env:
          SF_DESKTOP_VERSION: ${{ steps.channel.outputs.version }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          ELECTROBUN_TEAMID: ${{ secrets.APPLE_TEAM_ID }}
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.ASC_KEY_ID }}
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ELECTROBUN_APPLEAPIKEYPATH="$RUNNER_TEMP/notary.p8"
          sh scripts/bundle.sh "${{ steps.channel.outputs.channel }}"
          ls -la artifacts

      - name: Check the signature
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/desktop
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app=$(ls -d build/*-macos-arm64/*.app)
          # The same requirement the app checks an update against (src/bun/update-verify.ts).
          codesign --verify --strict --deep --verbose=2 \
            -R="anchor apple generic and identifier \"com.software-factory.desktop\" and certificate leaf[subject.OU] = \"$TEAM_ID\"" "$app"
          spctl --assess --type exec --verbose=2 "$app"
          xcrun stapler validate "$app"

      # The helper as a downloaded and an updated Mac get it: signature, requirement, entitlements,
      # embedded profile, Gatekeeper, and the launch smoke test (spec 40 M4b).
      - name: Check the key helper
        if: steps.secrets.outputs.ready == 'true' && env.SF_KEYS_PROFILE != ''
        working-directory: apps/desktop
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          mkdir "$work/zip" "$work/tar"
          ditto -x -k "artifacts/$CHANNEL-macos-arm64-Software-Factory.zip" "$work/zip"
          tar -xf artifacts/"$CHANNEL"-macos-arm64-*.app.tar.zst -C "$work/tar"
          for form in zip tar; do
            sh scripts/check-keys-helper.sh "$(ls -d "$work/$form"/*.app)" "$TEAM_ID" "$SF_KEYS_PROFILE"
          done
          # The rebuilt update archive is the one its manifest names: the updater checks both.
          archive=$(ls artifacts/"$CHANNEL"-macos-arm64-*.app.tar.zst)
          zstd -dc "$archive" > "$work/app.tar"
          sha=$(shasum -a 256 "$work/app.tar" | cut -d' ' -f1)
          size=$(stat -f %z "$work/app.tar")
          manifests=$(ls artifacts/*-update-v2.json)
          [ -n "$manifests" ] || { echo "::error::no -update-v2.json manifest"; exit 1; }
          for manifest in $manifests; do
            want_sha=$(node -p "require('./$manifest').artifact.tarSha256")
            want_size=$(node -p "require('./$manifest').artifact.tarSize")
            if [ "$sha" != "$want_sha" ] || [ "$size" != "$want_size" ]; then
              echo "::error::the update archive ($sha, $size bytes) isn't the one $manifest names ($want_sha, $want_size)"; exit 1
            fi
          done
          echo "update archive matches its manifest ($sha, $size bytes)"
          rm -rf "$work"

      # Versioned object names, uploaded before the manifests, which go last: a client never sees a
      # manifest naming an archive that isn't there yet, nor an old archive under a new hash.
      # The upload uses an R2 token scoped to this one bucket, held only by this environment.
      - name: Upload to downloads.zerobsai.com/desktop
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/desktop
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          node scripts/publish-release.ts upload \
            --channel "${{ steps.channel.outputs.channel }}" \
            --version "${{ steps.channel.outputs.version }}"
          echo "::notice title=Desktop ${{ steps.channel.outputs.channel }} ${{ steps.channel.outputs.version }}::https://downloads.zerobsai.com/desktop/${{ steps.channel.outputs.channel }}-macos-arm64-Software-Factory.zip"

      - name: Clean up the keychain
        if: always()
        run: |
          [ -n "${MACOS_KEYCHAIN:-}" ] && security delete-keychain "$MACOS_KEYCHAIN" || true
          rm -P -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/devid.p12" "$RUNNER_TEMP/devid.pem" "$RUNNER_TEMP/devid-once.p12" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/sf-keys.provisionprofile"
